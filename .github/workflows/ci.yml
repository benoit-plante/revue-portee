name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest
      - name: Coverage >= 90% per core package (ENF-QUA-04)
        run: |
          status=0
          for package in domain dedup reporting; do
            echo "::group::$package"
            uv run coverage report --include="src/revue_portee/$package/*" --fail-under=90 || status=1
            echo "::endgroup::"
          done
          exit $status
