# OSF "Generalized Systematic Review Registration" form (EF-CAD-06): its 65 items and
# the protocol sections that provide their content. An item without section is filled
# directly in the OSF form (dates, review stage) or does not apply to most scoping
# reviews; the correspondence table says so.
id: osf-gsrr
version: "1.00"
source: >-
  van den Akker OR, Peters GJY, Bakker CJ, et al. Increasing the transparency of
  systematic reviews: presenting a generalized registration form. Syst Rev.
  2023;12:170. doi:10.1186/s13643-023-02281-7 (form version v1.00, items GSRRF-1 to
  GSRRF-65, read in PMC10514995 on 2026-10-07).
verified: true
