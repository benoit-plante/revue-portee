# Default AI configuration of a new project (docs/03-architecture.md §6).
# Copied into projet.toml ([ia]) when a project is created; the project file then
# prevails. Model names live here and in projet.toml, never in the code.
as_of: "2026-10-07"

# How the AI is supervised (EF-CAD-07, RAISE). Values from docs/02-exigences.md.
supervision:
  # V1: one human reviewer screens every reference; the AI is a second reviewer whose
  # decisions never exclude a reference on their own (D-009, D-014).
  mode: second_reviewer
  ai_alone_may_exclude: false
  # EF-SEL-01: pilot on a random sample before screening (default 100 at title and
  # abstract), drawn with a recorded seed, human decisions blinded (EF-SEL-02).
  pilot_sample_size: 100
  # EF-SEL-05, EF-SEL-11: thresholds favour sensitivity; default target 0.95.
  target_sensitivity: "0.95"
  # docs/03-architecture.md §6.5: isotonic regression (Platt with little data).
  calibration_method: isotonic
  # EF-SEL-09: thresholds on the probability of inclusion before any pilot. The AI
  # excludes only below 0.10 (90 % sure of the exclusion) and includes from 0.60;
  # in between, uncertain. A pilot replaces them with calibrated thresholds.
  exclude_below: "0.10"
  include_above: "0.60"

# One entry per AI task. "planned" tasks are described in the protocol but cannot run yet.
tasks:
  suggest_pcc:
    status: enabled
    provider: anthropic
    model: claude-opus-5-5
    params:
      max_tokens: 16000
      effort: medium
      fallbacks: default
    # Used by the cost estimate before the call (thinking included).
    expected_output_tokens: 3000
  qualify_criterion_change:
    status: enabled
    provider: anthropic
    model: claude-opus-5-5
    params:
      max_tokens: 16000
      effort: medium
      fallbacks: default
    expected_output_tokens: 1500
  suggest_terms:
    status: enabled
    provider: anthropic
    model: claude-opus-5-5
    params:
      max_tokens: 16000
      effort: medium
      fallbacks: default
    expected_output_tokens: 3000
  # Title and abstract screening (tranche 1.6): one call per reference, the criteria
  # cached across references. A fast model at low effort keeps the cost under
  # 5 USD per 1,000 references (D-015); the SYNERGY benchmark checks the choice.
  # Haiku has no server-side fallback: no "fallbacks" parameter.
  screen_reference:
    status: enabled
    provider: anthropic
    model: claude-haiku-5-5
    params:
      max_tokens: 8000
      effort: low
    expected_output_tokens: 1200
  # Full-text screening (tranche 2.2): one call per report, its text by page without
  # the bibliography (10,000 to 20,000 tokens), the criteria cached across reports. The
  # same fast model as at title and abstract; to be checked on the validation study.
  screen_fulltext:
    status: enabled
    provider: anthropic
    model: claude-haiku-5-5
    params:
      max_tokens: 12000
      effort: low
    expected_output_tokens: 2500
  # Reports of a same study (tranche 2.3): one call per pair proposed by the rules,
  # the first pages of both texts.
  group_reports:
    status: enabled
    provider: anthropic
    model: claude-haiku-5-5
    params:
      max_tokens: 8000
      effort: low
    expected_output_tokens: 1500
