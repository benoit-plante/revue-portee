# Model prices (ENF-COU-05): edit this file, not the code, when prices change.
# Amounts are in US dollars per million tokens, standard (non-batch) API rates.
# cache_write is the 5-minute cache write price (1.25 × input); cache_read is the
# price of tokens served from the prompt cache.
as_of: "2026-10-06"
source: >-
  Anthropic, public API prices (Claude API documentation, reference consulted on
  2026-10-06). Haiku 5.5: the cache read price is assumed to be 0.1 × input, and the
  prices apply to prompts up to 100K tokens.
currency: USD
per_tokens: 1000000
# Message Batches API: every token at half price (asynchronous, results within 24 h).
batch_factor:
  anthropic: "0.5"
providers:
  anthropic:
    claude-fable-5-1:
      input: "10.00"
      output: "50.00"
      cache_write: "12.50"
      cache_read: "0.25"
    claude-opus-5-5:
      input: "4.00"
      output: "20.00"
      cache_write: "5.00"
      cache_read: "0.20"
    claude-sonnet-5-5:
      input: "2.00"
      output: "10.00"
      cache_write: "2.50"
      cache_read: "0.20"
    claude-haiku-5-5:
      input: "0.10"
      output: "0.50"
      cache_write: "0.125"
      cache_read: "0.01"
