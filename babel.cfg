# Message extraction (patterns are relative to src/):
#   uv run pybabel extract -F babel.cfg -k french --no-location --sort-output -o messages.pot src
#   uv run pybabel update -i messages.pot -d src/revue_portee/i18n/locale -l fr --no-fuzzy-matching
# then translate the French catalog, and rebuild the English one from its identifiers:
#   uv run python -m revue_portee.i18n.english
[python: **.py]
[jinja2: revue_portee/web/templates/**.html]
